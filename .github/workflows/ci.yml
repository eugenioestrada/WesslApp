name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore Wessl.slnx
      - run: dotnet build Wessl.slnx --configuration Release --no-restore
      - run: dotnet test tests/Wessl.Tests/Wessl.Tests.csproj --configuration Release --no-build
